{% extends "base.html" %}
{% block title %}Log in — Road Rakshak{% endblock %}

{% block content %}
<section class="rr-auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="rr-auth-card">
          <h1 class="rr-h2 mb-1">Welcome back</h1>
          <p class="rr-body-text mb-4">Log in to submit and track your road damage complaints.</p>

          <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label class="form-label" for="email">Email address</label>
              <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required>
            </div>

            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn rr-btn-primary w-100">Log in</button>
          </form>

          <p class="rr-body-text text-center mt-4 mb-0">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
